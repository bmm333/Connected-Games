openapi: 3.1.0
info:
  title: Connected Games - Tournament API
  version: 0.1.0
  description: |
    Tournaments, registrations, brackets and standings. The same service runs a chess tournament and a
    foosball tournament: what changes between them is declared in the tournament, not in the API.

    - `format` decides how the participants are paired (single elimination, round robin, Swiss).
    - `scoring` decides how a result becomes points and how ties in the standings are broken.
    - `participantKind` decides who registers: a `PLAYER` (the game type is individual) or a `SQUAD`
      (the game type is played by teams). It is read from the game type of the catalog when the
      tournament is created, with `squadSize`, and cannot be changed afterwards.

    A new format is a new member of `TournamentFormat`: clients that do not know it still read the
    tournament, the matches and the standings, because those do not depend on the format.

    ## Squads

    A squad exists only inside the tournament it registers to (ADR012). Its `participantId` is
    generated by this service when the registration is created. For a `PLAYER` tournament the
    `participantId` is the `playerId`, so it is the same string that match and stats use.

    ## How a tournament match is played

    1. `POST /tournaments/{id}/start` creates the matches. Those with both participants known are
       `READY`.
    2. The operator picks a `READY` match in the console. The console gives the hub the
       `tournamentMatchId` and the `participantId` and `displayName` of the two sides, and the hub
       writes them in `MatchStarted`.
    3. When `MatchCompleted` arrives, this service checks that the sides are those of the
       tournament match and records the result with `source: MATCH`. If they are not, the event
       is discarded with a log (ADR012). A `CANCELLED` match leaves the tournament match `READY`.
    4. A table without a hub (a chess board, for example) is recorded by a manager with
       `PUT .../result`, with `source: MANUAL`.

    ## Who can do what

    Every authenticated token reads the tournaments that are not `DRAFT`, with their registrations,
    matches and standings: players sign up at any organization. A `DRAFT` is visible only to the
    managers of its organization; to everyone else it does not exist (404). Creating, changing,
    publishing, starting, cancelling, setting a result and registering someone else are for a
    `VENUE_MANAGER` of the organization of the tournament. A player registers and withdraws only
    itself. A token that is not allowed gets 403, and one that cannot see the tournament gets 404.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/tournament
    description: Through the gateway
security:
  - bearerAuth: []
tags:
  - name: Tournaments
    description: Create, publish, start and cancel a tournament
  - name: Registrations
    description: Players and squads that take part
  - name: Matches
    description: Bracket or rounds, and the result of each match
  - name: Standings
    description: Classification

paths:
  /tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      summary: Tournaments the token can see
      description: Most recent first. A `DRAFT` appears only to the managers of its organization.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TournamentStatus'
        - name: gameTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: venueId
          in: query
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: mine
          in: query
          description: When true, only the tournaments where the player of the token is registered, alone or in a squad
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tournaments]
      operationId: createTournament
      summary: Create a tournament as a draft
      description: >-
        Manager of `organizationId`. The game type must exist in the catalog: `participantKind` and
        `squadSize` come from it. Nothing is visible to players until the tournament is published.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreate'
      responses:
        '201':
          description: Tournament created
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Tournaments]
      operationId: getTournament
      summary: Tournament details
      responses:
        '200':
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tournaments]
      operationId: updateTournament
      summary: Change a tournament
      description: >-
        Manager of its organization. The fields that are not sent stay as they are; a nullable field is
        cleared with `null`. `gameTypeId`, `format` and `scoring` can change only while the tournament is a
        `DRAFT`; the other fields until it starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdate'
      responses:
        '200':
          description: Tournament changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tournaments]
      operationId: deleteTournament
      summary: Delete a draft
      description: >-
        Manager of its organization. Only a `DRAFT` can be deleted, a published tournament is cancelled.
      responses:
        '204':
          description: Draft deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/publish:
    post:
      tags: [Tournaments]
      operationId: publishTournament
      summary: Open the registrations
      description: >-
        Manager of its organization. `DRAFT` becomes `REGISTRATION_OPEN`. Publishing a tournament that is
        already open changes nothing and answers 200.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament open for registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/start:
    post:
      tags: [Tournaments]
      operationId: startTournament
      summary: Close the registrations and create the matches
      description: >-
        Manager of its organization. `REGISTRATION_OPEN` becomes `IN_PROGRESS` and the format creates the
        matches: the whole bracket for a single elimination, every round for a round robin, the first round
        for a Swiss (the next one is created when the previous is complete). It fails with 409 if there are
        fewer registrations than `minParticipants`. Starting a tournament already started changes nothing and
        answers 200.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/cancel:
    post:
      tags: [Tournaments]
      operationId: cancelTournament
      summary: Cancel a tournament
      description: >-
        Manager of its organization. A tournament that is not `COMPLETED` becomes `CANCELLED`. The registrations
        and the results already recorded stay readable. Cancelling a cancelled tournament answers 200.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Tournament cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/registrations:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Registrations]
      operationId: listRegistrations
      summary: Who is registered
      description: By registration time, the first to register first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Registrations]
      operationId: registerParticipant
      summary: Register a player or a squad
      description: |
        Allowed while the tournament is `REGISTRATION_OPEN` and `registrationClosesAt` has not passed.

        In a `PLAYER` tournament `members` is omitted and the participant is the player of the token. A
        manager registering someone at the desk sends the player in `members`, with one member.

        In a `SQUAD` tournament `members` has exactly `squadSize` players and the player of the token is
        one of them; a manager can register any squad. A player is in at most one registration of a
        tournament.

        With the same `Idempotency-Key` a repeated call returns the registration of the first one.
        Without it, a player already registered gets 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Registered
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /tournaments/{tournamentId}/registrations/{registrationId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
      - $ref: '#/components/parameters/RegistrationId'
    patch:
      tags: [Registrations]
      operationId: updateRegistration
      summary: Set the seed of a registration
      description: >-
        Manager of the organization, before the tournament starts. The seed puts the participant in the
        bracket when the format uses `seeding: MANUAL`. Two registrations cannot have the same seed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationUpdate'
      responses:
        '200':
          description: Registration changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Registrations]
      operationId: withdrawRegistration
      summary: Withdraw a registration
      description: >-
        A player of the registration, or a manager of the organization, while the tournament is
        `REGISTRATION_OPEN`. Once it has started a participant cannot leave.
      responses:
        '204':
          description: Registration withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Matches]
      operationId: listTournamentMatches
      summary: Matches of the bracket or of the rounds
      description: Ordered by round, then by slot. Empty until the tournament starts.
      parameters:
        - name: round
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TournamentMatchStatus'
        - name: participantId
          in: query
          description: Only the matches of this participant
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{tournamentId}/matches/{tournamentMatchId}:
    get:
      tags: [Matches]
      operationId: getTournamentMatch
      summary: One match of the tournament
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentMatchId'
      responses:
        '200':
          description: Match found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentMatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{tournamentId}/matches/{tournamentMatchId}/result:
    put:
      tags: [Matches]
      operationId: setTournamentMatchResult
      summary: Record the result of a match by hand
      description: >-
        Manager of the organization, for a match played without a hub. The match must be `READY` or already
        recorded by hand: a result that came from a hub (`source: MATCH`) cannot be replaced. The winner
        goes on in the bracket. A draw (no `winnerSide`) is refused by a single elimination.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentMatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualResult'
      responses:
        '200':
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{tournamentId}/standings:
    get:
      tags: [Standings]
      operationId: getStandings
      summary: Classification of the tournament
      description: >-
        Ordered by rank. Participants with the same points and the same tie-breakers share the rank. In a
        single elimination the rank follows the round where each participant was eliminated and the winner
        is first. It is empty until the tournament starts.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the one of an earlier call with the same Idempotency-Key'
      schema:
        type: boolean

  parameters:
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentMatchId:
      name: tournamentMatchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the client makes up for each action and sends again if it does not know whether the call
        arrived. The same key with the same body, within 24 hours, gets the response of the first call.
        The same key with another body gets 422.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: A parameter or the body is not valid (a malformed id or date, a limit out of range, a missing field)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token missing, expired or not valid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but is not allowed to do this
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        Resource not found, or not visible to the token: a draft of another organization looks like
        a tournament that does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The tournament is not in a state that allows this (registrations closed, already started, too few
        participants), the tournament is full, or the player is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used with a different body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Side:
      type: string
      enum: [RED, BLUE]

    TournamentStatus:
      type: string
      description: >-
        `DRAFT`, then `REGISTRATION_OPEN` when published, `IN_PROGRESS` when started and `COMPLETED` when
        the last match has a result. `CANCELLED` from any state except `COMPLETED`.
      enum: [DRAFT, REGISTRATION_OPEN, IN_PROGRESS, COMPLETED, CANCELLED]

    ParticipantKind:
      type: string
      enum: [PLAYER, SQUAD]

    TournamentMatchStatus:
      type: string
      description: >-
        `PENDING` waits for the result of an earlier match to know a participant, `READY` can be played,
        `COMPLETED` has a result.
      enum: [PENDING, READY, COMPLETED]

    ResultSource:
      type: string
      description: >-
        `MATCH` came from a closed match of the match service, `MANUAL` was recorded by a manager,
        `BYE` is a participant that goes on without playing.
      enum: [MATCH, MANUAL, BYE]

    Tiebreaker:
      type: string
      description: >-
        Applied in order when participants have the same points. `BUCHHOLZ` is the sum of the points of
        the opponents, used in Swiss tournaments.
      enum: [WINS, SCORE_DIFFERENCE, SCORE_FOR, HEAD_TO_HEAD, BUCHHOLZ]

    ScoringPolicy:
      type: object
      description: Points for a result, and how ties are broken. A single elimination ranks by round and ignores it.
      required: [win, draw, loss, tiebreakers]
      properties:
        win:
          type: number
          minimum: 0
          default: 3
        draw:
          type: number
          minimum: 0
          default: 1
        loss:
          type: number
          minimum: 0
          default: 0
        tiebreakers:
          type: array
          items:
            $ref: '#/components/schemas/Tiebreaker'
          uniqueItems: true
          default: [SCORE_DIFFERENCE, SCORE_FOR]

    SingleElimination:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: SINGLE_ELIMINATION
        seeding:
          type: string
          description: '`MANUAL` follows the seed of each registration, `RANDOM` draws the bracket when the tournament starts'
          enum: [MANUAL, RANDOM]
          default: RANDOM
        thirdPlaceMatch:
          type: boolean
          description: Adds a match between the two losers of the semifinals
          default: false

    RoundRobin:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: ROUND_ROBIN
        legs:
          type: integer
          description: How many times each pair meets
          minimum: 1
          maximum: 2
          default: 1

    Swiss:
      type: object
      required: [type, rounds]
      properties:
        type:
          type: string
          const: SWISS
        rounds:
          type: integer
          description: Participants with the same points meet in each round; nobody meets the same opponent twice
          minimum: 1
          maximum: 20

    TournamentFormat:
      description: How the participants are paired. `type` tells which member it is.
      oneOf:
        - $ref: '#/components/schemas/SingleElimination'
        - $ref: '#/components/schemas/RoundRobin'
        - $ref: '#/components/schemas/Swiss'
      discriminator:
        propertyName: type
        mapping:
          SINGLE_ELIMINATION: '#/components/schemas/SingleElimination'
          ROUND_ROBIN: '#/components/schemas/RoundRobin'
          SWISS: '#/components/schemas/Swiss'

    Tournament:
      type: object
      required:
        - id
        - organizationId
        - gameTypeId
        - name
        - status
        - format
        - scoring
        - participantKind
        - squadSize
        - minParticipants
        - registeredCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
          description: Where it is played. Missing if any venue of the organization can host a match.
        gameTypeId:
          type: string
          format: uuid
        name:
          type: string
          examples: [Winter foosball cup]
        description:
          type: string
        status:
          $ref: '#/components/schemas/TournamentStatus'
        format:
          $ref: '#/components/schemas/TournamentFormat'
        scoring:
          $ref: '#/components/schemas/ScoringPolicy'
        participantKind:
          $ref: '#/components/schemas/ParticipantKind'
        squadSize:
          type: integer
          description: Players of a squad; 1 when `participantKind` is `PLAYER`
          minimum: 1
        minParticipants:
          type: integer
          minimum: 2
        maxParticipants:
          type: integer
          description: Missing means no limit, up to 128
          minimum: 2
          maximum: 128
        registeredCount:
          type: integer
          minimum: 0
        currentRound:
          type: integer
          description: Round being played, present while `IN_PROGRESS`
          minimum: 1
        startsAt:
          type: string
          format: date-time
          description: Planned start, only to tell the players
        registrationClosesAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    TournamentCreate:
      type: object
      required: [organizationId, gameTypeId, name, format]
      properties:
        organizationId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        gameTypeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        format:
          $ref: '#/components/schemas/TournamentFormat'
        scoring:
          $ref: '#/components/schemas/ScoringPolicy'
        minParticipants:
          type: integer
          minimum: 2
          default: 2
        maxParticipants:
          type: integer
          minimum: 2
          maximum: 128
        startsAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time

    TournamentUpdate:
      type: object
      minProperties: 1
      properties:
        venueId:
          type: [string, 'null']
          format: uuid
        gameTypeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        format:
          $ref: '#/components/schemas/TournamentFormat'
        scoring:
          $ref: '#/components/schemas/ScoringPolicy'
        minParticipants:
          type: integer
          minimum: 2
        maxParticipants:
          type: [integer, 'null']
          minimum: 2
          maximum: 128
        startsAt:
          type: [string, 'null']
          format: date-time
        registrationClosesAt:
          type: [string, 'null']
          format: date-time

    Member:
      type: object
      required: [playerId, displayName]
      properties:
        playerId:
          type: string
          format: uuid
          description: >-
            Not secret, it is the id that matches and statistics already show
        displayName:
          type: string
          minLength: 1
          maxLength: 60

    Registration:
      type: object
      required: [id, tournamentId, participantId, displayName, members, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        participantId:
          type: string
          description: The `playerId` for a player, generated for a squad. It is what the matches carry in `participantId`.
        displayName:
          type: string
          description: Name of the player or of the squad, as shown in brackets and standings
        members:
          type: array
          description: One player, or the `squadSize` players of the squad
          minItems: 1
          items:
            $ref: '#/components/schemas/Member'
        seed:
          type: integer
          minimum: 1
        registeredAt:
          type: string
          format: date-time

    RegistrationRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Name of the player, or of the squad
          minLength: 1
          maxLength: 60
        members:
          type: array
          description: See the operation. Missing for a player that registers itself.
          minItems: 1
          items:
            $ref: '#/components/schemas/Member'

    RegistrationUpdate:
      type: object
      required: [seed]
      properties:
        seed:
          type: [integer, 'null']
          minimum: 1

    TournamentMatchSide:
      type: object
      required: [side]
      properties:
        side:
          $ref: '#/components/schemas/Side'
        participantId:
          type: string
          description: Missing while it depends on the result of an earlier match, or for the empty side of a bye
        displayName:
          type: string

    TournamentMatchResult:
      type: object
      required: [source, redScore, blueScore, completedAt]
      properties:
        source:
          $ref: '#/components/schemas/ResultSource'
        winnerSide:
          $ref: '#/components/schemas/Side'
        redScore:
          type: integer
          minimum: 0
        blueScore:
          type: integer
          minimum: 0
        matchId:
          type: string
          format: uuid
          description: The closed match of the match service, present when `source` is `MATCH`
        completedAt:
          type: string
          format: date-time

    AdvancesTo:
      type: object
      description: Where the winner goes in a single elimination
      required: [tournamentMatchId, side]
      properties:
        tournamentMatchId:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/Side'

    TournamentMatch:
      type: object
      description: >-
        This `id` is the `tournamentMatchId` that the hub writes in `MatchStarted`. A match with no
        `winnerSide` in its result is a draw.
      required: [id, tournamentId, round, slot, status, sides]
      properties:
        id:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        round:
          type: integer
          minimum: 1
        slot:
          type: integer
          description: Position in the round, from 0, to draw the bracket
          minimum: 0
        thirdPlace:
          type: boolean
          description: True for the match for the third place of a single elimination
        status:
          $ref: '#/components/schemas/TournamentMatchStatus'
        sides:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/TournamentMatchSide'
        advancesTo:
          $ref: '#/components/schemas/AdvancesTo'
        result:
          $ref: '#/components/schemas/TournamentMatchResult'

    ManualResult:
      type: object
      required: [redScore, blueScore]
      properties:
        winnerSide:
          $ref: '#/components/schemas/Side'
        redScore:
          type: integer
          minimum: 0
        blueScore:
          type: integer
          minimum: 0

    StandingEntry:
      type: object
      required: [rank, participantId, displayName, played, wins, draws, losses, points, scoreFor, scoreAgainst]
      properties:
        rank:
          type: integer
          minimum: 1
        participantId:
          type: string
        displayName:
          type: string
        played:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        points:
          type: number
          minimum: 0
        scoreFor:
          type: integer
          minimum: 0
        scoreAgainst:
          type: integer
          minimum: 0
        eliminatedInRound:
          type: integer
          description: Single elimination only. Missing while the participant is still in, and for the winner.
          minimum: 1

    Problem:
      type: object
      description: Error in RFC 9457 format (Spring ProblemDetail)
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
