spring.application.name=catalog
# Every service has its own port (gateway 8100 ... stats 8105) so they can run together.
server.port=8102

#Rd vars of .env file at the repo root : pw ports
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:connectedgames}
spring.datasource.username=catalog
spring.datasource.password=${CATALOG_DB_PASSWORD:}

#Flyway onws theschema migrations in db/migration history table in schema "catalog"
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
# A database used with the local profile has R__demo_data applied: without that profile the
# script is not on the classpath, and Flyway must not refuse to start for it (*:future is the default)
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

#Hibernate only checks entities match tables created by flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
spring.jpa.open-in-view=false

# Errors as RFC 9457 application/problem+json
spring.mvc.problemdetails.enabled=true

# Every path starts with /api/catalog, as in the "servers" of contracts/openapi/catalog.yaml
server.servlet.context-path=/api/catalog

# Access tokens come from identity (contracts/openapi/identity.yaml): signature, iss, aud and exp are checked.
# The keys are downloaded at the first request with a token, so catalog starts even if identity is down.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8101/api/identity/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=connected-games-identity
spring.security.oauth2.resourceserver.jwt.audiences=connected-games
