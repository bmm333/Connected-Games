spring.application.name=catalog
# Every service has its own port (gateway 8100 ... stats 8105) so they can run together.
server.port=8102

#Rd vars of .env file at the repo root : pw ports
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:connectedgames}
spring.datasource.username=catalog
spring.datasource.password=${CATALOG_DB_PASSWORD:}

#Flyway onws theschema migrations in db/migration history table in schema "catalog"
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog

#Hibernate only checks entities match tables created by flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
spring.jpa.open-in-view=false

# Errors as RFC 9457 application/problem+json
spring.mvc.problemdetails.enabled=true
