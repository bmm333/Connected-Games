spring.application.name=match
# Every service has its own port (gateway 8100 ... stats 8105) so they can run together.
server.port=8103

# Reads the variables of the .env file at the repo root: passwords and ports
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:connectedgames}
spring.datasource.username=match
spring.datasource.password=${MATCH_DB_PASSWORD:}

# Flyway owns the schema: migrations in db/migration, history table in schema "match"
spring.flyway.schemas=match
spring.flyway.default-schema=match

# Hibernate only checks that entities match the tables created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=match
spring.jpa.open-in-view=false

# Errors as RFC 9457 application/problem+json
spring.mvc.problemdetails.enabled=true

# Every path starts with /api/match, as in the "servers" of contracts/openapi/match.yaml
server.servlet.context-path=/api/match
