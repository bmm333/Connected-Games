spring.application.name=identity
# Every service has its own port (gateway 8100 ... stats 8105) so they can run together.
server.port=8101

# Reads the variables of the .env file at the repo root: passwords and ports
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:connectedgames}
spring.datasource.username=identity
spring.datasource.password=${IDENTITY_DB_PASSWORD:}

# Flyway owns the schema: migrations in db/migration, history table in schema "identity"
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
# A database used with the local profile has R__demo_data applied: without that profile the
# script is not on the classpath, and Flyway must not refuse to start for it (*:future is the default)
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Hibernate only checks that entities match the tables created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.open-in-view=false

# Errors as RFC 9457 application/problem+json
spring.mvc.problemdetails.enabled=true

# Every path starts with /api/identity, as in the "servers" of contracts/openapi/identity.yaml
server.servlet.context-path=/api/identity
