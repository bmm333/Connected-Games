spring.application.name=stats
# Every service has its own port (gateway 8100 ... stats 8105) so they can run together.
server.port=8105

# Reads the variables of the .env file at the repo root: passwords and ports
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:connectedgames}
spring.datasource.username=stats
spring.datasource.password=${STATS_DB_PASSWORD:}
# The SQL of the adapters has no schema in front of the table names
spring.datasource.hikari.schema=stats

# Flyway owns the schema: migrations in db/migration, history table in schema "stats"
spring.flyway.schemas=stats
spring.flyway.default-schema=stats

spring.jpa.open-in-view=false

# Errors as RFC 9457 application/problem+json
spring.mvc.problemdetails.enabled=true

# Every path starts with /api/stats, as in the "servers" of contracts/openapi/stats.yaml
server.servlet.context-path=/api/stats

# Public key of identity: the services verify the access tokens with it, they never see the private key
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8101/api/identity/.well-known/jwks.json}

# Broker where the match service publishes MatchCompleted
stats.mqtt.url=${MQTT_URL:tcp://localhost:1883}
