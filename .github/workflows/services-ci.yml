name: Services CI

# Pull requests always start the workflow, so the "Services CI result" check
# can be required in branch protection: the "changes" job decides what to build.
# Pushes run only on the main branches, the PR run already covers feature branches.
on:
  pull_request:
  push:
    branches: [develop, main]
    paths:
      - "services/**"
      - ".github/workflows/services-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - "services/settings.gradle.kts"
              - "services/gradle/**"
              - "services/gradlew"
              - "services/gradlew.bat"
              - "services/architecture-rules/**"
              - ".github/workflows/services-ci.yml"
            gateway:
              - "services/gateway/**"
            identity:
              - "services/identity/**"
            catalog:
              - "services/catalog/**"
            match:
              - "services/match/**"
            tournament:
              - "services/tournament/**"
            stats:
              - "services/stats/**"

      # Shared changes rebuild every service, otherwise only the changed ones.
      - name: List services to build
        id: list
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$SHARED" = "true" ]; then
            services='["gateway","identity","catalog","match","tournament","stats"]'
          else
            services=$(jq -c 'map(select(. != "shared"))' <<< "$CHANGES")
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services to build: $services"

  build:
    name: Build and test ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    defaults:
      run:
        working-directory: services

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew :${{ matrix.service }}:build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests

  result:
    name: Services CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES_RESULT, build: $BUILD_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || exit 1
          [ "$BUILD_RESULT" = "success" ] || [ "$BUILD_RESULT" = "skipped" ]
